trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      TF_VERSION="1.16.1"
      cd "$(Agent.TempDirectory)"
      curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      unzip -q terraform.zip
      sudo install -m 0755 terraform /usr/local/bin/terraform
      terraform version
    displayName: Install Terraform

  - bash: terraform fmt -check -recursive
    displayName: Check Terraform formatting

  - bash: terraform init -backend=false -input=false
    displayName: Initialize Terraform

  - bash: terraform validate -no-color
    displayName: Validate Terraform configuration

  - task: AzureCLI@2
    displayName: Verify Azure service connection
    inputs:
      azureSubscription: 'sc-azure-terraform-lab-wif'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --query "{Subscription:name, Tenant:tenantId}" --output table