trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      wget -O - https://apt.releases.hashicorp.com/gpg \
        | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" \
        | sudo tee /etc/apt/sources.list.d/hashicorp.list
      sudo apt-get update
      sudo apt-get install -y terraform
      terraform version
    displayName: Install Terraform

  - bash: terraform fmt -check -recursive
    displayName: Check Terraform formatting

  - bash: terraform init -backend=false -input=false
    displayName: Initialize Terraform

  - bash: terraform validate -no-color
    displayName: Validate Terraform configuration
      - task: AzureCLI@2
    displayName: Verify Azure service connection
    inputs:
      azureSubscription: 'sc-azure-terraform-lab-wif'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --query "{Subscription:name, Tenant:tenantId}" --output table